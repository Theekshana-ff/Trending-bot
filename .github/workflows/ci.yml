name: Syntax & Automated Test Suite

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Run Syntax Checks
        run: npm run check
      - name: Run Automated Unit & Security Tests
        run: npm test
